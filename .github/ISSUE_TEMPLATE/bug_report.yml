name: Bug report
description: Report a reproducible bug in langoraph.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include a minimal Go snippet, test, or command sequence.
      render: bash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Go version, OS, module version, and provider if this touches llm.
      render: text
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Real behavior proof
      description: Paste terminal output, logs, or other evidence from a real run.
    validations:
      required: false
