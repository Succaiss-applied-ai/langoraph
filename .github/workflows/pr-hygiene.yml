name: PR Hygiene

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  real-behavior-proof:
    name: Real Behavior Proof
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate PR body
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = pr.labels.map((label) => label.name);
            const trustedAuthor = ["OWNER", "MEMBER", "COLLABORATOR"].includes(pr.author_association) || pr.user.type === "Bot";
            if (trustedAuthor && !labels.includes("proof: required")) {
              core.notice("Trusted author or bot PR; skipping proof gate unless proof: required is present.");
              return;
            }
            if (labels.includes("proof: override")) {
              core.notice("proof: override label present; skipping proof gate.");
              return;
            }

            const body = pr.body || "";
            const required = [
              "Behavior or issue addressed",
              "Real environment tested",
              "Exact steps or command run after this patch",
              "Evidence after fix",
              "Observed result after fix",
              "What was not tested",
            ];

            const missing = required.filter((heading) => !new RegExp(`(^|\\n)#+\\s*${heading}`, "i").test(body));
            if (missing.length === 0) {
              return;
            }

            const marker = "<!-- langoraph-real-behavior-proof -->";
            const message = [
              marker,
              "### Real behavior proof needed",
              "",
              "Please update the PR body with these sections before merge:",
              "",
              missing.map((item) => `- ${item}`).join("\n"),
              "",
              "Maintainers can apply `proof: override` when this gate should not apply, or `proof: required` to force the gate on trusted-author PRs.",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user.type === "Bot" && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: message,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: message,
              });
            }

            core.setFailed(`Missing real behavior proof sections: ${missing.join(", ")}`);
