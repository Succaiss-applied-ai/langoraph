name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish"
        required: true
        type: string
      dry_run:
        description: "Validate without creating a GitHub release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    name: Validate Release Candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run release checks
        run: |
          set -euo pipefail
          gofmt -l $(git ls-files '*.go') | tee /tmp/gofmt.txt
          test ! -s /tmp/gofmt.txt
          go vet ./...
          go test -race -count=1 ./...

  github-release:
    name: Publish GitHub Release
    needs: validate
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Generate release notes
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)"
          {
            echo "## $TAG_NAME"
            echo
            if [ -n "$previous" ]; then
              echo "Changes since $previous:"
              git log --pretty=format:'- %s (%h)' "$previous..$TAG_NAME"
              echo
            else
              echo "Initial tagged release."
            fi
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --notes-file release-notes.md --title "$TAG_NAME"
          else
            gh release create "$TAG_NAME" --verify-tag --notes-file release-notes.md --title "$TAG_NAME"
          fi
